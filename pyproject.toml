[project]
name = "vocal-ai-guru"
version = "1.0.0"
description = "Hindustani Classical Music Raaga Guru — Voice AI Agent using Gemini Live API"
requires-python = ">=3.11"

dependencies = [
    # Gemini SDK (Live API + generateContent for tool calls)
    "google-genai>=1.0.0",
    # Web framework
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    # Config & env
    "python-dotenv",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typing-extensions",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["evals"]
